<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuardianGrid Camera Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 { margin-top: 0; color: #38bdf8; }
        .video-container {
            position: relative;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            display: block;
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex-grow: 1;
        }
        input, select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #334155;
            color: white;
            font-size: 14px;
        }
        button {
            background-color: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0284c7; }
        button:disabled { background-color: #475569; cursor: not-allowed; }
        #status {
            padding: 10px;
            border-radius: 6px;
            background-color: #334155;
            font-family: monospace;
            height: 100px;
            overflow-y: auto;
        }
        .status-success { color: #4ade80; }
        .status-error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GuardianGrid Camera Client</h1>
        <p>Keep this tab open while you want the security gate camera to be active.</p>

        <div class="controls">
            <div class="input-group">
                <label for="serverUrl">Render Server URL</label>
                <input type="text" id="serverUrl" placeholder="https://your-app.onrender.com" value="">
            </div>
            <div class="input-group" style="flex-grow: 0; justify-content: flex-end;">
                <button id="startBtn">Start Streaming</button>
                <button id="stopBtn" disabled>Stop</button>
            </div>
        </div>

        <div class="video-container">
            <video id="video" autoplay playsinline muted></video>
        </div>
        
        <canvas id="canvas" style="display: none;"></canvas>

        <h3>Status Log</h3>
        <div id="status">Ready...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const serverUrlInput = document.getElementById('serverUrl');
        const statusLog = document.getElementById('status');

        let stream = null;
        let streamingInterval = null;
        let isUploading = false;

        function log(msg, type='info') {
            const time = new Date().toLocaleTimeString();
            let colorClass = '';
            if (type === 'error') colorClass = 'status-error';
            if (type === 'success') colorClass = 'status-success';
            
            statusLog.innerHTML = `<span class="${colorClass}">[${time}] ${msg}</span><br>` + statusLog.innerHTML;
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                
                // Wait for video to be ready to get dimensions
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    log(`Camera started: ${video.videoWidth}x${video.videoHeight}`, 'success');
                };

                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                // Start capturing frames every 400ms (2.5 fps - good balance of speed and bandwidth)
                streamingInterval = setInterval(captureAndSendFrame, 400);
            } catch (err) {
                log(`Error accessing camera: ${err.message}`, 'error');
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            if (streamingInterval) {
                clearInterval(streamingInterval);
            }
            startBtn.disabled = false;
            stopBtn.disabled = true;
            log('Streaming stopped.');
        }

        async function captureAndSendFrame() {
            // Don't pile up requests if connection is slow
            if (isUploading) return;
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                canvas.toBlob(async (blob) => {
                    isUploading = true;
                    try {
                        const formData = new FormData();
                        formData.append('image', blob, 'frame.jpg');
                        
                        let baseUrl = serverUrlInput.value ? serverUrlInput.value.replace(/\/$/, "") : window.location.origin;
                        const response = await fetch(`${baseUrl}/api/upload_frame`, {
                            method: 'POST',
                            body: formData
                        });
                        
                        if (response.ok) {
                            // Silently succeed to not spam the log
                        } else {
                            log(`Server error: ${response.status}`, 'error');
                        }
                    } catch (error) {
                        log(`Upload failed: ${error.message}`, 'error');
                    } finally {
                        isUploading = false;
                    }
                }, 'image/jpeg', 0.7); // 0.7 quality saves significant bandwidth
            }
        }

        startBtn.addEventListener('click', startCamera);
        stopBtn.addEventListener('click', stopCamera);
    </script>
</body>
</html>
